; FDNY Overlay settings
;
; This file is read every time the overlay starts. Edit a value after the
; "=" sign, save this file, then restart the overlay to see the change.
; Lines starting with ";" are comments and are ignored.
;
; If this file is missing or a line can't be understood, the overlay still
; starts (using built-in defaults) and shows a warning instead of crashing.

[general]
; Exact process name of the game, as shown in Task Manager -> Details.
process_name = FDNYFirefighter.exe

; How often the displayed values refresh, in milliseconds. 33 = ~30 times/sec.
refresh_ms = 33

; Text color for the watch values and the minimize/close buttons
text_color = 0,255,0

; Font size for everything in the overlay. The window resizes automatically
; to fit, so there's nothing else to adjust after changing this.
font_size = 12


; -----------------------------------------------------------------------
; Watches: each [watch:Name] section below is one line shown in the
; overlay, in the order they appear in this file.
;
; For a normal memory watch:
;   module   = the .exe or .dll the address is inside
;   base     = base offset, in hex (e.g. 0x00103A78) or decimal
;   offsets  = comma-separated pointer offsets to follow (hex or decimal),
;              or leave blank if there are none
;   type     = float, int, byte, short, or double
;   feeds    = optional. If this watch's raw value is also needed by a
;              calculated watch below, name the role it feeds:
;              velocity_x, velocity_y, velocity_z, z_collision_center, or
;              z_ground_height. Leave out entirely if nothing else needs it.
;
; For a value calculated from other watches, set "calculated = <kind>" and
; nothing else. Supported kinds: speed, previous_jump, previous_jump_max,
; current_jump_max.
;
; The section name after "watch:" (e.g. "Vel X") is only the label shown on
; screen - rename it freely, it has no effect on what the watch does. What
; matters is "feeds"/"calculated", not the label text.
;
; This section is technical, reverse-engineered data (from tools like Cheat
; Engine). Getting a value wrong won't break anything else - that one line
; will just show "<read?>", "<ptr?>", or similar instead of a real number.
; -----------------------------------------------------------------------

[watch:Vel X]
module = FDNYFirefighter.exe
base = 0x00103A78
offsets = 0x30,0x104
type = float
feeds = velocity_x

[watch:Vel Y]
module = FDNYFirefighter.exe
base = 0x00103A78
offsets = 0x30,0xFC
type = float
feeds = velocity_y

[watch:Vel Z]
module = FDNYFirefighter.exe
base = 0x00103A78
offsets = 0x30,0x100
type = float
feeds = velocity_z

[watch:Speed]
calculated = speed

[watch:Player State]
module = FDNYFirefighter.exe
base = 0x00103A78
offsets = 0x30,0x18c
type = byte

[watch:Player Ground State]
module = FDNYFirefighter.exe
base = 0x00103A78
offsets = 0x30,0x12c
type = byte

[watch:Z Collision Center]
module = genesis.dll
base = 0x362EE8
offsets =
type = float
feeds = z_collision_center

[watch:Z Ground Height]
module = FDNYFirefighter.exe
base = 0x00103A78
offsets = 0x30,0x3404
type = float
feeds = z_ground_height

[watch:Previous Jump]
calculated = previous_jump

[watch:Previous Jump Max]
calculated = previous_jump_max

[watch:Current Jump Max]
calculated = current_jump_max
