; FDNY Overlay settings
;
; This file is read every time the overlay starts. Edit a value after the
; "=" sign, save this file, then restart the overlay to see the change.
; Lines starting with ";" are comments and are ignored.
;
; If this file is missing or a line can't be understood, the overlay still
; starts (using built-in defaults) and shows a warning instead of crashing.

[general]
; Exact process name of the game, as shown in Task Manager -> Details.
process_name = FDNYFirefighter.exe

; How often the displayed values refresh, in milliseconds. 33 = ~30 times/sec.
refresh_ms = 33

; Which corner of the game window the overlay attaches to.
; Options: top-left, top-right, bottom-left, bottom-right
anchor_corner = top-left

; Distance in pixels from that corner.
anchor_margin_x = 40
anchor_margin_y = 40

; How often (in milliseconds) the overlay re-checks the game window's
; position/size, in case it moved or was resized.
anchor_refresh_ms = 500

; Text color for the watch values and the minimize/close buttons
text_color = 0,255,0


; -----------------------------------------------------------------------
; Watches: each [watch:Name] section below is one line shown in the
; overlay, in the order they appear in this file.
;
; For a normal memory watch:
;   module   = the .exe or .dll the address is inside
;   base     = base offset, in hex (e.g. 0x00103A78) or decimal
;   offsets  = comma-separated pointer offsets to follow (hex or decimal),
;              or leave blank if there are none
;   type     = float, int, byte, short, or double
;
; For a value calculated from other watches (Speed, jump-height stats),
; set "calculated = true" and nothing else. These labels are recognized by
; exact name internally: Speed, Previous Jump, Previous Jump Max,
; Current Jump Max.
;
; This section is technical, reverse-engineered data (from tools like Cheat
; Engine). Getting a value wrong won't break anything else - that one line
; will just show "<read?>", "<ptr?>", or similar instead of a real number.
; -----------------------------------------------------------------------

[watch:Vel X]
module = FDNYFirefighter.exe
base = 0x00103A78
offsets = 0x30,0x104
type = float

[watch:Vel Y]
module = FDNYFirefighter.exe
base = 0x00103A78
offsets = 0x30,0xFC
type = float

[watch:Vel Z]
module = FDNYFirefighter.exe
base = 0x00103A78
offsets = 0x30,0x100
type = float

[watch:Speed]
calculated = true

[watch:Player State]
module = FDNYFirefighter.exe
base = 0x00103A78
offsets = 0x30,0x18c
type = byte

[watch:Player Ground State]
module = FDNYFirefighter.exe
base = 0x00103A78
offsets = 0x30,0x12c
type = byte

[watch:Z Collision Center]
module = genesis.dll
base = 0x362EE8
offsets =
type = float

[watch:Z Ground Height]
module = FDNYFirefighter.exe
base = 0x00103A78
offsets = 0x30,0x3404
type = float

[watch:Previous Jump]
calculated = true

[watch:Previous Jump Max]
calculated = true

[watch:Current Jump Max]
calculated = true
