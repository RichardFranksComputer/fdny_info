name: Release Warp Info Overlay

# Release model: publishing a GitHub Release whose tag starts with
# "warp-info-" (e.g. warp-info-v1.2.0) builds the collision overlay and
# attaches the zip/exe/conf to that release. Releases with any other tag
# prefix (e.g. player-info-*) are ignored. workflow_dispatch is kept for a
# manual test build, which uploads the zip as a workflow artifact instead
# (there's no release to attach it to).
on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write # needed to upload assets to the release

jobs:
  build:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'warp-info-')
    runs-on: windows-latest
    defaults:
      run:
        working-directory: overlay-warp-info
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install pyinstaller pymem

      - name: Build exe
        run: pyinstaller --noconfirm --clean --onefile --windowed --name fdny_collision_overlay fdny_collision_overlay.py

      - name: Package
        shell: pwsh
        run: |
          Copy-Item dgVoodoo.conf dist/
          Compress-Archive -Path dist/fdny_collision_overlay.exe, dist/dgVoodoo.conf -DestinationPath fdny_collision_overlay.zip

      - name: Upload assets to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" fdny_collision_overlay.zip dist/fdny_collision_overlay.exe dist/dgVoodoo.conf --clobber

      - name: Upload zip as a workflow artifact (manual test runs only)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: Warp Info Overlay
          path: overlay-warp-info/fdny_collision_overlay.zip
          if-no-files-found: error
